name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  e2e-tests: # This name is what you will search for in the settings
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: Staging
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        E2E_FRONT_URL: ${{ vars.E2E_FRONT_URL }}
        E2E_STANDARD_USER: ${{ secrets.E2E_STANDARD_USER }}
        E2E_LOCKED_USER: ${{ secrets.E2E_LOCKED_USER }}
        E2E_PROBLEM_USER: ${{ secrets.E2E_PROBLEM_USER }}
        E2E_PERFORMANCE_USER: ${{ secrets.E2E_PERFORMANCE_USER }}
        E2E_ERROR_USER:  ${{ secrets.E2E_ERROR_USER }}
        E2E_VISUAL_USER: ${{ secrets.E2E_VISUAL_USER }}
        E2E_ALL_USER_PSWD: ${{ secrets.E2E_ALL_USER_PSWD }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30